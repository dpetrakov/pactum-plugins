name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  documents:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: plugins/document-review/package-lock.json
      - run: npm ci --prefix plugins/document-review
      - run: npm install --global bb-app@0.46.1
      - run: npx playwright install --with-deps chromium
        working-directory: plugins/document-review
      - run: node scripts/check-public-source.mjs
      - run: npm run typecheck --prefix plugins/document-review
      # Keep the strict CPU benchmark isolated from concurrent integration tests.
      - run: node --experimental-strip-types --test tests/markdown-perf.test.mjs
        working-directory: plugins/document-review
      - run: node --experimental-strip-types --test --test-skip-pattern='^H7 projection' --test-reporter=dot tests/*.test.mjs
        working-directory: plugins/document-review
        env:
          PACTUM_BROWSER_TESTS: '1'
      - run: npm audit --omit=dev --audit-level=high --prefix plugins/document-review
      - run: bb plugin build plugins/document-review
  mermaid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - run: npm ci --prefix plugins/pactum-mermaid-flowchart
      - run: npm install --global bb-app@0.46.1
      - run: npm run typecheck --prefix plugins/pactum-mermaid-flowchart
      - run: npm test --prefix plugins/pactum-mermaid-flowchart
      - run: npm audit --omit=dev --audit-level=high --prefix plugins/pactum-mermaid-flowchart
      - run: bb plugin build plugins/pactum-mermaid-flowchart
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - run: npm ci --prefix plugins/document-review
      - run: npm ci --prefix plugins/pactum-mermaid-flowchart
      - run: npx playwright install --with-deps chromium
        working-directory: plugins/document-review
      - run: node plugins/document-review/node_modules/typescript/bin/tsc -p site/tsconfig.json
      - run: node --experimental-strip-types scripts/build-site.mjs
      - run: git diff --exit-code -- site/index.html site/assets/
      - run: node --test tests/site.test.mjs tests/site-browser.test.mjs
