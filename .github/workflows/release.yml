name: Release Documents
on:
  push:
    tags: ['document-review-v*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: plugins/document-review/package-lock.json
      - run: npm ci --prefix plugins/document-review
      - run: npm install --global bb-app@0.46.1
      - run: npx playwright install --with-deps chromium
        working-directory: plugins/document-review
      - run: node scripts/check-public-source.mjs
      - run: node scripts/check-release.mjs "${GITHUB_REF_NAME}"
      - run: npm run typecheck --prefix plugins/document-review
      # Keep the strict CPU benchmark isolated from concurrent integration tests.
      - run: node --experimental-strip-types --test tests/markdown-perf.test.mjs
        working-directory: plugins/document-review
      - run: node --experimental-strip-types --test --test-skip-pattern='^H7 projection' --test-reporter=dot tests/*.test.mjs
        working-directory: plugins/document-review
        env:
          PACTUM_BROWSER_TESTS: '1'
      - run: npm audit --omit=dev --audit-level=high --prefix plugins/document-review
      - run: bb plugin build plugins/document-review
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "Pactum Docs ${GITHUB_REF_NAME#document-review-v}" --notes-file .github/release-notes.md
