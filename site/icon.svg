  <text
    x="16"
    y="23"
    fill="#fff"
    font-family="Fraunces, Georgia, 'Times New Roman', serif"
    font-size="19"
    font-style="italic"
    font-weight="500"
    text-anchor="middle">P</text>
  <circle cx="30" cy="2" r="4.5" fill="#c2503d" stroke="#faf8f2" stroke-width="1.25"/>
</svg>

