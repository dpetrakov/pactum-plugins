<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -3.12 35.12 35.12" width="35.12" height="35.12" role="img" aria-labelledby="title desc">
  <title id="title">Pactum mark 32px</title>
  <desc id="desc">Pactum V03 mark for 32px favicon and topbar use. The witness dot extends beyond the top-right corner with a size-adjusted cream separation ring.</desc>
